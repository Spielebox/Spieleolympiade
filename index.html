<style>
:root{
  --bg:#0f1226; --bg2:#171b3a; --card:#1d2250; --line:#2e3570;
  --gold:#f5c542; --gold2:#ffdf7a; --text:#f2f4ff; --muted:#9aa3d6;
  --danger:#ff6b6b; --ok:#5fd68a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#2a2f7a 0%,var(--bg) 60%) no-repeat,var(--bg)}
#app{max-width:760px;margin:0 auto;padding:16px 14px 80px;overflow-x:hidden}
.card{overflow-wrap:anywhere}
h1,h2,h3{margin:0}
.hero{text-align:center;padding:22px 0 8px}
.hero .logo{width:min(250px,62vw);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.hdrlogo{width:34px;height:auto;flex:none}
.hero h1{font-size:28px;margin-top:8px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.hero p{color:var(--muted);margin:6px 0 0;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin-bottom:8px;color:var(--gold2)}
.card h3{font-size:15px;margin:10px 0 4px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:600;color:#1a1500;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 2px 0 #b8901c;text-decoration:none;display:inline-block;text-align:center}
button:active{transform:translateY(1px)}
button.sec{background:var(--bg2);color:var(--text);border:1px solid var(--line);box-shadow:none}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
button.icon{padding:8px 12px;background:transparent;color:var(--danger);box-shadow:none;font-size:18px}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:120px;resize:vertical;line-height:1.45}
textarea.big{min-height:380px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>div{min-width:0}
input[type=date],input[type=time]{display:block;height:46px;line-height:1.2}
input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
@media(max-width:430px){.grid2{grid-template-columns:minmax(0,1fr);gap:0}}
.olycard{display:block;text-decoration:none;color:inherit}
.olycard .t{font-weight:700;font-size:17px}
.olycard .m{color:var(--muted);font-size:14px;margin-top:4px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--gold2);margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:6px;margin:10px 0;padding-bottom:4px}
.tabs a{flex:1 1 0;min-width:0;text-align:center;text-decoration:none;color:var(--muted);padding:10px 4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs a.on{color:#1a1500;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold)}
.back{color:var(--muted);text-decoration:none;font-size:14px;display:inline-block;padding:6px 0}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--gold2);flex:none}
.warn{color:#ffb86b;font-size:14px;margin-top:8px}
.ok{color:var(--ok);font-size:14px;margin-top:8px}
.points{display:flex;gap:8px;margin:8px 0}
.points div{flex:1;min-width:0;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.points b{display:block;font-size:22px;color:var(--gold2)}
ul.rules{margin:6px 0 0;padding-left:20px;line-height:1.55}
ul.rules li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#000c;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;transition:transform .25s;z-index:10;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* ============ Intro ============ */
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;--cx:50%;--cy:42%;--b:0;--gl:0;--rl:0}
#intro .ibg{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 42%,#2a3088 0%,#12163a 55%,#070918 100%)}
#intro .iglow{position:absolute;left:var(--cx);top:var(--cy);width:130vmax;height:130vmax;margin:-65vmax 0 0 -65vmax;
  background:radial-gradient(circle,rgba(245,197,66,.42) 0,rgba(245,197,66,.12) 16%,transparent 38%);
  opacity:var(--gl);transform:scale(calc(.55 + var(--b)*.4))}
#intro .rays{position:absolute;left:var(--cx);top:var(--cy);width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(from 0deg,rgba(245,197,66,.22) 0 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);mask-image:radial-gradient(circle,#000 0,transparent 42%);
  opacity:var(--rl);animation:spin 40s linear infinite}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#intro .ring{position:absolute;left:var(--cx);top:var(--cy);width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;
  background:radial-gradient(circle,transparent 65%,var(--rc,#f5c542) 67%,transparent 70%);opacity:0;animation:ring 1.6s ease-out forwards;pointer-events:none}
#intro .flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at var(--cx) var(--cy),#fff 0,rgba(255,240,190,.75) 28%,transparent 72%)}
#intro .istage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:0 16px;margin-top:-4vh}
#intro .ilogo{width:min(320px,74vw)}
#intro .ipulse{position:relative;transform:scale(calc(1 + var(--b)*.03))}
#intro .ipulse img{display:block;width:100%;height:auto;opacity:0}
#intro .ipulse img.in{animation:logoIn 1.2s cubic-bezier(.2,.9,.3,1.1) both}
#intro .ishine{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);background-size:250% 100%;background-position:160% 0;background-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#intro .ititle{margin:0;font-size:clamp(30px,9.5vw,54px);letter-spacing:1px;text-align:center;color:var(--gold2);text-shadow:0 0 22px rgba(245,197,66,.55);white-space:nowrap}
#intro .ititle span{display:inline-block;opacity:0;transform:translateY(26px)}
#intro .ititle.go span{animation:rise .6s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*.055s)}
#intro .ihint{position:absolute;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:0}
#intro .ihint.show{animation:hintIn .8s ease-out both,pulse 2.4s ease-in-out .8s infinite}
#intro .iveil{position:absolute;inset:0;background:#05061a;transition:opacity 1.4s ease-out}
#intro .istart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .5s}
#intro .orb{width:14px;height:14px;border-radius:50%;background:var(--gold2);box-shadow:0 0 30px 12px rgba(245,197,66,.55);animation:orb 2.2s ease-in-out infinite}
#intro .istart .t{color:var(--muted);font-size:13px;letter-spacing:3px;text-transform:uppercase;animation:pulse 2.2s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.5);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(var(--rs,9))}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes hintIn{to{opacity:.7}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.75}}
@keyframes logoIn{
  0%{opacity:0;transform:scale(.12) rotate(-20deg);filter:blur(14px) drop-shadow(0 0 0 rgba(245,197,66,0))}
  55%{opacity:1;transform:scale(1.13) rotate(3deg);filter:blur(0) drop-shadow(0 0 46px rgba(245,197,66,.95))}
  76%{transform:scale(.97) rotate(-1deg)}
  100%{opacity:1;transform:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(245,197,66,.35))}}
#intro .ipieces{position:absolute;inset:0}
#intro .pc{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;will-change:transform;filter:drop-shadow(0 0 12px rgba(255,170,60,.6))}
#intro .ipulse img.lit{opacity:1;animation:ignite 1.5s ease-out both}
@keyframes ignite{
  0%{filter:brightness(2.6) drop-shadow(0 0 80px rgba(255,170,60,1)) drop-shadow(0 0 0 rgba(0,0,0,0))}
  100%{filter:brightness(1) drop-shadow(0 8px 24px rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(245,197,66,.35))}}
.intro-pending .hero h1,.intro-pending .hero p,.intro-pending>.card,.intro-pending>.empty,.intro-pending>.olycard{opacity:0}
.hide-logo .hero .logo{visibility:hidden}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* ============ Speicher-Schicht ============
   Später austauschbar gegen einen Server (Cloudflare Worker). */
const Store = {
  KEY: 'spieleolympiade.v1',
  load() {
    try {
      const d = JSON.parse(localStorage.getItem(this.KEY));
      if (d && Array.isArray(d.olympiads)) return d;
    } catch (e) {}
    return { version: 1, olympiads: [] };
  },
  save(d) {
    try { localStorage.setItem(this.KEY, JSON.stringify(d)); }
    catch (e) { toast('Speichern fehlgeschlagen (Speicher voll oder gesperrt)'); }
  }
};

const LOGO = document.querySelector('link[rel=icon]').dataset.logo;
let db = Store.load();
const save = () => Store.save(db);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function newOlympiad() {
  return {
    id: uid(),
    name: 'Spieleolympiade ' + new Date().getFullYear(),
    date: '', time: '', place: '', president: '', notes: '',
    participants: [],   // {id, name, gameTitle, gameNote}  (gameTitle: ab Schritt 2)
    games: [],          // ab Schritt 2/3: Reihenfolge, Platzierungen
    invite: '', inviteCustom: false,
    status: 'prep',     // prep | running | finished
    createdAt: Date.now()
  };
}

/* ============ Routing ============ */
function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'o' && h[1]) {
    const o = db.olympiads.find(x => x.id === h[1]);
    if (o) return { o, tab: h[2] || 'details' };
  }
  return { o: null };
}
const cur = () => route().o;

function render() {
  const r = route();
  $('app').innerHTML = r.o ? viewOlympiad(r.o, r.tab) : viewHome();
}
window.addEventListener('hashchange', render);

/* ============ Hilfsfunktionen ============ */
function fmtDate(d) {
  if (!d) return '';
  const x = new Date(d + 'T00:00:00');
  if (isNaN(x)) return d;
  return x.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtShort(d) {
  if (!d) return 'Termin offen';
  const x = new Date(d + 'T00:00:00');
  return isNaN(x) ? d : x.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + ' Std ' : '') + (m ? m + ' Min' : (h ? '' : '0 Min'));
}
const statusLabel = s => ({ prep: 'Vorbereitung', running: 'Läuft', finished: 'Beendet' }[s] || s);

function viewOlympiad(o, tab) {
  const tabs = [['details', 'Details'], ['teilnehmer', 'Teilnehmer'], ['einladung', 'Einladung'], ['regeln', 'Regeln']];
  const body = { details: tabDetails, teilnehmer: tabTeilnehmer, einladung: tabEinladung, regeln: tabRegeln }[tab] || tabDetails;
  return `
  <a class="back" href="#/">‹ Alle Olympiaden</a>
  <div class="row"><img class="hdrlogo" src="${LOGO}" alt=""><h2 class="grow" style="font-size:20px">${esc(o.name || 'Ohne Namen')}</h2><span class="badge">${statusLabel(o.status)}</span></div>
  <div class="tabs">${tabs.map(([k, l]) => `<a class="${k === tab ? 'on' : ''}" href="#/o/${o.id}/${k}">${l}</a>`).join('')}</div>
  ${body(o)}`;
}

function tabDetails(o) {
  return `
  <div class="card">
    <h2>Eckdaten</h2>
    <label>Name der Olympiade</label>
    <input value="${esc(o.name)}" oninput="setField('name',this.value)" placeholder="z. B. Spieleolympiade Winter 2026">
    <div class="grid2">
      <div><label>Datum</label><input type="date" value="${esc(o.date)}" oninput="setField('date',this.value)"></div>
      <div><label>Beginn</label><input type="time" value="${esc(o.time)}" oninput="setField('time',this.value)"></div>
    </div>
    <label>Austragungsort</label>
    <input value="${esc(o.place)}" oninput="setField('place',this.value)" placeholder="Adresse oder Name des Ortes">
    <label>Präsident (moderiert, kümmert sich um Urkunden &amp; Preise)</label>
    <input value="${esc(o.president)}" oninput="setField('president',this.value)" placeholder="Name">
    <label>Notizen / Hinweise für alle</label>
    <textarea oninput="setField('notes',this.value)" placeholder="z. B. Parkplätze, Essen &amp; Trinken, Dresscode …">${esc(o.notes)}</textarea>
  </div>
  <div class="card">
    <h2>Austragung</h2>
    <p class="muted">Sobald alle Teilnehmer eingetragen sind, startet hier später die Olympiade mit geheimer Titeleingabe und Auslosung.</p>
    <button disabled style="width:100%">▶ Austragung starten (folgt in Schritt 2)</button>
  </div>
  <div class="card">
    <button class="danger" onclick="deleteOly()">Olympiade löschen</button>
  </div>`;
}

function tabTeilnehmer(o) {
  const n = o.participants.length;
  const total = n * 15;
  return `
  <div class="card">
    <h2>Teilnehmer</h2>
    <p class="muted">Jeder Teilnehmer bringt genau ein Spiel mit und ist dabei Schiedsrichter.</p>
    <div class="row">
      <input id="pname" class="grow" placeholder="Name eintragen" onkeydown="if(event.key==='Enter')addParticipant()" autocomplete="off">
      <button onclick="addParticipant()">Hinzufügen</button>
    </div>
    ${n ? `<ul class="plist">${o.participants.map((p, i) => `
      <li><span class="num">${i + 1}</span><span class="grow">${esc(p.name)}</span>
      <button class="icon" onclick="removeParticipant('${p.id}')" aria-label="Entfernen">✕</button></li>`).join('')}</ul>`
      : `<div class="empty">Noch niemand eingetragen.</div>`}
    ${n === 0 ? '' : n < 3
      ? `<div class="warn">⚠ Mindestens 3 Teilnehmer nötig, damit es Platz 1–3 gibt (besser mehr).</div>`
      : `<div class="ok">✓ ${n} Teilnehmer = ${n} Spiele · ca. ${fmtDur(total)} reine Spielzeit bei 15 Min je Spiel (plus Pausen &amp; Siegerehrung)</div>`}
  </div>`;
}

function buildInvite(o) {
  const L = [];
  L.push(`🏅 Einladung zur ${o.name || 'Spieleolympiade'}`, '');
  if (o.date) L.push(`📅 Wann: ${fmtDate(o.date)}${o.time ? ', Beginn ' + o.time + ' Uhr' : ''}`);
  if (o.place) L.push(`📍 Wo: ${o.place}`);
  if (o.president) L.push(`🎤 Präsident: ${o.president}`);
  if (o.date || o.place || o.president) L.push('');
  L.push('So funktioniert’s:',
    '• Jeder Teilnehmer bereitet ein Spiel für alle anderen vor und ist dabei Schiedsrichter (er spielt bei seinem Spiel nicht mit). Er stellt das Spiel vor, erklärt es und führt es durch.',
    '• Dauer pro Spiel: höchstens ca. 15 Minuten, inklusive Erklärung.',
    '• Das Spiel muss eindeutig Platz 1, 2 und 3 liefern. Plant bei Bedarf ein Stechen ein.',
    '• Erlaubt ist alles: Quiz, Geschicklichkeit, Schnelligkeit, Brett-, Karten- oder Würfelspiele oder Mischungen – selbst ausgedacht oder bekannt.',
    '• Punkte pro Spiel: Platz 1 = 3 Punkte, Platz 2 = 2 Punkte, Platz 3 = 1 Punkt.',
    '• Wer nach allen Spielen die meisten Punkte hat, gewinnt. Auch Gesamtplatz 2 und 3 werden geehrt.',
    '• Euren Spieletitel tragt ihr vor Ort geheim in der App ein. Welches Spiel zuerst dran ist, entscheidet das Los!',
    '',
    'Bitte bringt alles mit, was ihr für euer Spiel braucht.');
  if (o.participants.length) L.push('', '👥 Dabei sind: ' + o.participants.map(p => p.name).join(', '));
  if (o.notes) L.push('', o.notes);
  L.push('', 'Gebt bitte kurz Bescheid, ob ihr dabei seid. Wir freuen uns auf euch!');
  return L.join('\n');
}

function tabEinladung(o) {
  if (!o.inviteCustom) o.invite = buildInvite(o);
  return `
  <div class="card">
    <h2>Einladungsentwurf</h2>
    <p class="muted">Wird aus deinen Daten erzeugt. Du kannst den Text frei ändern – dann bleibt deine Fassung erhalten.</p>
    <textarea class="big" id="invite" oninput="setInvite(this.value)">${esc(o.invite)}</textarea>
    <div class="row wrap" style="margin-top:10px">
      <button class="grow" onclick="copyInvite()">📋 Kopieren</button>
      <button class="sec grow" onclick="shareInvite()">↗ Teilen</button>
      <button class="sec grow" onclick="resetInvite()">↺ Neu aus Vorlage</button>
    </div>
  </div>`;
}

function tabRegeln() {
  return `
  <div class="card">
    <h2>Punkte pro Spiel</h2>
    <div class="points"><div><b>3</b>Platz 1</div><div><b>2</b>Platz 2</div><div><b>1</b>Platz 3</div></div>
    <p class="muted">Wer nach allen Spielen die meisten Punkte hat, gewinnt. Gesamtplatz 2 und 3 werden ebenfalls prämiert.</p>
  </div>
  <div class="card">
    <h2>Regeln für Spielvorbereiter</h2>
    <ul class="rules">
      <li>Jeder Teilnehmer bereitet <b>ein</b> Spiel vor und ist dabei <b>Schiedsrichter</b> – er spielt nicht mit.</li>
      <li>Er stellt das Spiel vor, erklärt es und führt es durch.</li>
      <li>Dauer: <b>maximal ca. 15 Minuten</b> je Spiel.</li>
      <li>Es muss <b>eindeutig Platz 1–3</b> geben. Ggf. ein <b>Stechen</b> vorsehen.</li>
      <li>Alles ist erlaubt: Quiz, Geschicklichkeit, Schnelligkeit, Brett-, Karten-, Würfelspiele, Mischungen; selbst ausgedacht oder bekannt.</li>
    </ul>
  </div>
  <div class="card">
    <h2>Rollen</h2>
    <ul class="rules">
      <li><b>Präsident:</b> eröffnet die Olympiade, kümmert sich um Urkunden und Preise für die ersten drei Gesamtplätze und überreicht sie.</li>
      <li><b>Schiedsrichter:</b> der Teilnehmer, dessen Spiel gerade läuft.</li>
    </ul>
  </div>`;
}

/* ============ Aktionen ============ */
function createOly() {
  const o = newOlympiad();
  db.olympiads.push(o); save();
  location.hash = '#/o/' + o.id;
}
function deleteOly() {
  const o = cur(); if (!o) return;
  if (!confirm(`„${o.name}“ wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
  db.olympiads = db.olympiads.filter(x => x.id !== o.id); save();
  location.hash = '#/';
}
function setField(k, v) {
  const o = cur(); if (!o) return;
  o[k] = v; save();
}
function addParticipant() {
  const o = cur(), inp = $('pname'); if (!o || !inp) return;
  const name = inp.value.trim();
  if (!name) return;
  if (o.participants.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('Diesen Namen gibt es schon'); return; }
  o.participants.push({ id: uid(), name, gameTitle: '', gameNote: '' });
  save(); render();
  const again = $('pname'); if (again) again.focus();
}
function removeParticipant(id) {
  const o = cur(); if (!o) return;
  const p = o.participants.find(x => x.id === id);
  if (!p || !confirm(`${p.name} entfernen?`)) return;
  o.participants = o.participants.filter(x => x.id !== id);
  save(); render();
}
function setInvite(v) { const o = cur(); if (!o) return; o.invite = v; o.inviteCustom = true; save(); }
function resetInvite() {
  const o = cur(); if (!o) return;
  if (o.inviteCustom && !confirm('Deine Änderungen am Text gehen verloren. Fortfahren?')) return;
  o.inviteCustom = false; save(); render(); toast('Text neu erzeugt');
}
async function copyInvite() {
  const txt = $('invite').value;
  try { await navigator.clipboard.writeText(txt); toast('In die Zwischenablage kopiert'); }
  catch (e) { $('invite').select(); document.execCommand('copy'); toast('Kopiert'); }
}
async function shareInvite() {
  const txt = $('invite').value;
  if (navigator.share) { try { await navigator.share({ title: cur().name, text: txt }); } catch (e) {} }
  else copyInvite();
}

/* ============ Export / Import ============ */
function exportAll() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spieleolympiade-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup erstellt');
}
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.olympiads)) throw new Error('format');
    const mode = db.olympiads.length
      ? confirm('OK = mit vorhandenen Daten zusammenführen\nAbbrechen = zurück (nichts ändern)')
      : true;
    if (!mode) return;
    const have = new Set(db.olympiads.map(o => o.id));
    let added = 0;
    d.olympiads.forEach(o => { if (o && o.id && !have.has(o.id)) { db.olympiads.push(o); added++; } });
    save(); render(); toast(added + ' Olympiade(n) importiert');
  } catch (err) { toast('Datei konnte nicht gelesen werden'); }
});

function loadIntroAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  const none = { ctx: null, ready: Promise.resolve(null) };
  if (!AC) return none;
  let ctx; try { ctx = new AC(); } catch (e) { return none; }
  const ready = fetch(INTRO_AUDIO).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(b => new Promise((res, rej) => ctx.decodeAudioData(b, res, rej))).catch(() => null);
  return { ctx, ready };
}

  const r0 = ov.querySelector('.ilogo').getBoundingClientRect();
  const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  ov.style.setProperty('--cx', cx + 'px'); ov.style.setProperty('--cy', cy + 'px');
  const cv = ov.querySelector('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const g = cv.getContext('2d');
  let b = 0;  // Puls (0..1)

  /* ================= Variante 1: Konfetti ================= */
  const cols = ['#0a7cff', '#ffd400', '#ff2a1a', '#1fc83a', '#ffffff', '#f5c542'];
  let P = [], confRunning = false, lastF = 0;
  function burst(n, o = {}) {
    const pw = o.power || 1, x0 = (o.x ?? cx) * dpr, y0 = (o.y ?? cy) * dpr;
    for (let i = 0; i < n; i++) {
      const dir = o.angle != null, a = dir ? o.angle + (Math.random() - .5) * (o.spread || .8) : Math.random() * 6.283;
      const v = (4 + Math.random() * 10) * pw * dpr;
      P.push({ x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (dir ? 0 : 3 * dpr),
        w: (5 + Math.random() * 7) * dpr, h: (3 + Math.random() * 5) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .45,
        c: cols[Math.random() * cols.length | 0], age: 0, max: 2400 + Math.random() * 1600 });
    }
    if (!confRunning) { confRunning = true; lastF = performance.now(); requestAnimationFrame(confLoop); }
  }
  function confLoop(now) {
    if (!cv.isConnected) return;
    const dt = now - lastF, f = Math.min(3, dt / 16.7); lastF = now;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    P = P.filter(p => p.age < p.max);
    P.forEach(p => {
      p.age += dt; p.vx *= Math.pow(.985, f); p.vy = p.vy * Math.pow(.985, f) + .22 * dpr * f;
      p.x += p.vx * f; p.y += p.vy * f; p.r += p.vr * f;
      g.globalAlpha = Math.min(1, (p.max - p.age) / 700);
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
    });
    if (P.length) requestAnimationFrame(confLoop); else confRunning = false;
  }

  /* ================= Variante 2: Funken & Glut ================= */
  let EP = [], ambient = 0, lastE = 0, emberOn = false;
  const rnd = (a, c) => a + Math.random() * (c - a);
  function ember(x, y, vx = rnd(-.4, .4), vy = -rnd(.4, 1.5)) {
    if (EP.length > 420) return;
    EP.push({ k: 0, x, y, vx, vy, r: rnd(1, 2.6), age: 0, max: rnd(2600, 5600), ph: rnd(0, 6.28), hue: rnd(18, 42) });
  }
  function sparks(x, y, n, pw = 1, o = {}) {
    for (let i = 0; i < n && EP.length < 520; i++) {
      const a = o.angle != null ? o.angle + (Math.random() - .5) * (o.spread || .6) : Math.random() * 6.283;
      const v = rnd(2, 11) * pw;
      EP.push({ k: 1, x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, max: rnd(650, 1700), w: rnd(1, 2.4), hue: rnd(26, 50) });
    }
  }
  function emberFrame(now) {
    if (!ov.isConnected) return;
    const dt = Math.min(50, now - lastE), f = dt / 16.7; lastE = now;
    let n = ambient * f;
    while (n > 0) { if (Math.random() < Math.min(1, n)) ember(rnd(0, innerWidth), innerHeight + 8); n -= 1; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    EP = EP.filter(p => p.age < p.max && p.y > -40 && p.y < innerHeight + 60);
    for (const p of EP) {
      p.age += dt; const lt = p.age / p.max;
      if (p.k === 0) {
        p.x += p.vx * f + Math.sin(p.age * .002 + p.ph) * .35 * f; p.y += p.vy * f;
        const al = (1 - lt) * (.55 + .45 * Math.sin(p.ph + p.age * .008));
        g.fillStyle = `hsla(${p.hue},100%,${55 + 20 * (1 - lt)}%,${al * .22})`; g.beginPath(); g.arc(p.x, p.y, p.r * 3.6, 0, 6.283); g.fill();
        g.fillStyle = `hsla(${p.hue},100%,72%,${al})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill();
      } else {
        p.px = p.x; p.py = p.y; p.vx *= Math.pow(.985, f); p.vy = p.vy * Math.pow(.985, f) + .16 * f;
        p.x += p.vx * f; p.y += p.vy * f;
        g.strokeStyle = `hsla(${p.hue},100%,${62 + 25 * (1 - lt)}%,${1 - lt})`; g.lineWidth = p.w;
        g.beginPath(); g.moveTo(p.px, p.py); g.lineTo(p.x, p.y); g.stroke();
      }
    }
    requestAnimationFrame(emberFrame);
  }

  /* ================= Effekte ================= */
  function ring(col = '#f5c542', delay = 0, x, y, scale) {
    const r = document.createElement('div'); r.className = 'ring';
    r.style.setProperty('--rc', col); r.style.animationDelay = delay + 's';
    if (x != null) { r.style.left = x + 'px'; r.style.top = y + 'px'; }
    if (scale) r.style.setProperty('--rs', scale);
    ov.insertBefore(r, stage); setTimeout(() => r.remove(), 2200 + delay * 1000);
  }
  function flash(a) {
    const f = document.createElement('div'); f.className = 'flash'; ov.appendChild(f);
    f.animate([{ opacity: a }, { opacity: 0 }], { duration: 650, easing: 'ease-out' }).onfinish = () => f.remove();
  }
  function flashAt(x, y, size, a) {
    const f = document.createElement('div');
    f.style.cssText = `position:absolute;z-index:4;pointer-events:none;border-radius:50%;left:${x}px;top:${y}px;width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;background:radial-gradient(circle,#fff 0,rgba(255,200,110,.75) 35%,transparent 70%)`;
    ov.appendChild(f);
    f.animate([{ opacity: a, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(1.25)' }], { duration: 450, easing: 'ease-out' }).onfinish = () => f.remove();
  }
  function shake(amp, dur) {
    const k = [{ transform: 'translate(0,0)' }];
    for (let i = 1; i <= 7; i++) { const d = amp * (1 - i / 8); k.push({ transform: `translate(${rnd(-d, d)}px,${rnd(-d, d)}px)` }); }
    k.push({ transform: 'translate(0,0)' });
    stage.animate(k, { duration: dur });
  }
  function shine() {
    shineEl.animate([{ backgroundPosition: '160% 0' }, { backgroundPosition: '-60% 0' }], { duration: 1100, easing: 'ease-in-out' });
  }

  /* Puzzleteile: Position des Schwerpunkts bei gegebener Verschiebung/Drehung/Skalierung */
  const V = Math.max(innerWidth, innerHeight);
  function pieceCenter(i, tx = 0, ty = 0, rot = 0, s = 1) {
    const relx = (PIECE_CENT[i][0] - .5) * r0.width * s, rely = (PIECE_CENT[i][1] - .5) * r0.height * s;
    const c = Math.cos(rot * Math.PI / 180), si = Math.sin(rot * Math.PI / 180);
    return [cx + tx + relx * c - rely * si, cy + ty + relx * si + rely * c];
  }
  const landed = [false, false, false, false, false];
  let landedN = 0, igniteT = null;
  function land(i, t) {
    landed[i] = true; landedN++;
    pcs[i].style.transform = 'none'; pcs[i].style.opacity = 1;
    const [x, y] = pieceCenter(i);
    pcs[i].animate([{ transform: 'scale(1.09)' }, { transform: 'none' }], { duration: 320, easing: 'ease-out' });
    b = 1;
    if (i < 4) {
      flashAt(x, y, 360, .75); ring('#ffcf5a', 0, x, y, 4); sparks(x, y, 46, 1); shake(5, 280);
      for (let k = 0; k < 8; k++) ember(x + rnd(-40, 40), y + rnd(-30, 30), rnd(-.8, .8), -rnd(.6, 2));
    } else {
      igniteT = t;
      flash(.95); ring('#ffcf5a'); ring('#ffffff', .15); ring('#ff9a2e', .3, undefined, undefined, 12);
      sparks(cx, cy, 170, 1.5); shake(10, 520);
      for (let k = 0; k < 40; k++) ember(cx + rnd(-r0.width / 2, r0.width / 2), cy + rnd(-r0.height / 3, r0.height / 3), rnd(-1, 1), -rnd(.8, 3));
      logoImg.classList.add('lit'); shine();
      setTimeout(() => { if (piecesBox) piecesBox.style.display = 'none'; }, 160);
    }
  }

  function cue(n, t) {
    if (!FUNKEN) {
      switch (n) {
        case 'hit1':  flash(.9); ring(); logoImg.classList.add('in'); burst(60); b = 1; break;
        case 'ring':  flash(.35); ring(); burst(70); b = 1; break;
        case 'title': flash(.6); ring(); ring('#ffffff', .18); title.classList.add('go'); shine(); burst(130, { power: 1.25 }); b = 1; break;
        case 'hint':  hint.classList.add('show'); break;
        case 'small': burst(18, { power: .6 }); b = 1; break;
        case 'med':   ring(); burst(60); b = 1; break;
        case 'big':
          flash(.8); ring(); ring('#ffffff', .2); shine(); burst(150, { power: 1.4 });
          burst(60, { x: 0, y: innerHeight, angle: -1.05, spread: .7, power: 1.7 });
          burst(60, { x: innerWidth, y: innerHeight, angle: -2.09, spread: .7, power: 1.7 });
          b = 1; break;
      }
      return;
    }
    switch (n) {
      case 'title': title.classList.add('go'); break;
      case 'hint':  hint.classList.add('show'); break;
      case 'small': for (let k = 0; k < 10; k++) ember(cx + rnd(-90, 90), cy + rnd(-40, 80), rnd(-.6, .6), -rnd(.8, 2.4)); b = 1; break;
      case 'med':   ring('#ffcf5a'); sparks(cx, cy, 60, 1); b = 1; break;
      case 'big':
        flash(.5); ring('#ffcf5a'); ring('#ffffff', .2); shine();
        sparks(0, innerHeight, 90, 1.9, { angle: -1.15, spread: .55 });
        sparks(innerWidth, innerHeight, 90, 1.9, { angle: -1.99, spread: .55 });
        sparks(cx, cy, 70, 1.2); b = 1; break;
    }
  }

  /* ================= Ablauf ================= */
  let phase = 0, mode = 'clock', tStart = 0, node = null, el = null;
  const clock = () => mode === 'web' ? aud.ctx.currentTime - tStart
                    : mode === 'el' ? el.currentTime : (performance.now() - tStart) / 1000;
  const MIN_T = FUNKEN ? 5.4 : 3;

  async function begin() {
    phase = 1;
    const st = ov.querySelector('.istart'); st.style.opacity = 0; setTimeout(() => st.remove(), 500);
    ov.querySelector('.iveil').style.opacity = 0;
    let resumed = null;
    if (aud.ctx) { try { resumed = aud.ctx.resume(); } catch (e) {} }
    const buf = await Promise.race([aud.ready, new Promise(r => setTimeout(() => r(null), 2500))]);
    try { await Promise.race([resumed, new Promise(r => setTimeout(r, 800))]); } catch (e) {}
    let an = null;
    if (buf && aud.ctx && aud.ctx.state === 'running') {
      const s = aud.ctx.createBufferSource(); s.buffer = buf;
      const gain = aud.ctx.createGain(); an = aud.ctx.createAnalyser(); an.fftSize = 256;
      s.connect(gain); gain.connect(aud.ctx.destination); gain.connect(an);
      tStart = aud.ctx.currentTime + 0.05; s.start(tStart); mode = 'web'; node = { s, gain };
    } else {
      try { el = new Audio(INTRO_AUDIO); await el.play(); mode = 'el'; }
      catch (e) { el = null; mode = 'clock'; tStart = performance.now(); }
    }
    if (FUNKEN) { emberOn = true; lastE = performance.now(); requestAnimationFrame(emberFrame); }
    const data = an ? new Uint8Array(an.frequencyBinCount) : null;
    let ci = 0, slow = 0;
    (function tick() {
      if (phase === 2 || !ov.isConnected) return;
      const t = clock();
      while (ci < CUES.length && t >= CUES[ci][0]) cue(CUES[ci++][1], t);
      if (FUNKEN) {
        FLIGHT.forEach((fl, i) => {
          if (landed[i]) return;
          const p = (t - (fl.t - FLIGHT_DUR)) / FLIGHT_DUR;
          if (p <= 0) return;
          if (p >= 1) { land(i, t); return; }
          const e = Math.pow(p, 2.4), k = 1 - e;
          const tx = fl.dx * V * k, ty = fl.dy * V * k, rot = fl.rot * k, s = 1 + .9 * k;
          pcs[i].style.opacity = Math.min(1, p * 5);
          pcs[i].style.transform = `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${s})`;
          const [x, y] = pieceCenter(i, tx, ty, rot, s);
          if (Math.random() < .9) sparks(x, y, 2, .35);
          if (Math.random() < .5) ember(x, y, rnd(-.5, .5), rnd(-.3, .6));
        });
      }
      if (an) {
        an.getByteFrequencyData(data);
        const cur = (data[1] + data[2] + data[3] + data[4]) / 4;
        slow = slow * .97 + cur * .03;
        b = Math.max(Math.max(0, Math.min(1, (cur - slow) / 45 + .25)), b * .9);
      } else b *= .92;
      const ramp = Math.min(1, Math.max(0, t) / 1.2);
      ov.style.setProperty('--b', b.toFixed(3));
      if (FUNKEN) {
        const lit = igniteT != null ? Math.min(1, (t - igniteT) / 1.2) : 0;
        ov.style.setProperty('--gl', (ramp * (.22 + .1 * landedN + .6 * lit) * (.6 + .4 * b)).toFixed(3));
        ov.style.setProperty('--rl', (lit * (.5 + .5 * b)).toFixed(3));
        ambient = ramp * (igniteT != null ? 1.1 : .3) * (.7 + b * .8);
      } else {
        ov.style.setProperty('--gl', (ramp * (.55 + .45 * b)).toFixed(3));
        ov.style.setProperty('--rl', (ramp * (.5 + .5 * b)).toFixed(3));
      }
      requestAnimationFrame(tick);
    })();
  }

  function stopMusic() {
    if (mode === 'web' && node) {
      const c = aud.ctx.currentTime;
      node.gain.gain.cancelScheduledValues(c); node.gain.gain.setValueAtTime(node.gain.gain.value, c);
      node.gain.gain.linearRampToValueAtTime(0, c + 1.4);
      try { node.s.stop(c + 1.5); } catch (e) {}
    } else if (mode === 'el' && el) {
      const t0 = performance.now(), v0 = el.volume;
      const iv = setInterval(() => {
        const k = (performance.now() - t0) / 1400;
        try { el.volume = Math.max(0, v0 * (1 - k)); } catch (e) {}
        if (k >= 1) { el.pause(); clearInterval(iv); }
      }, 60);
    }
  }

  function go() {
    if (phase !== 1 || clock() < MIN_T) return;
    phase = 2; ambient = 0; document.removeEventListener('keydown', kd);
    stopMusic(); ov.style.setProperty('--b', 0);
    leaveIntro(ov, app);
  }
  const kd = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); phase === 0 ? begin() : go(); } };
  ov.addEventListener('click', () => { phase === 0 ? begin() : go(); });
  document.addEventListener('keydown', kd);
}

function leaveIntro(ov, app) {
  const il = ov.querySelector('.ilogo');
  const from = il.getBoundingClientRect();
  const to = app.querySelector('.hero .logo').getBoundingClientRect();
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  const s = to.width / from.width;
  ov.style.pointerEvents = 'none';
  ov.querySelectorAll('.ibg,.iglow,.rays,canvas,.ititle,.ihint,.ring,.flash').forEach(el => {
    const o = parseFloat(getComputedStyle(el).opacity);
    el.animate([{ opacity: isNaN(o) ? 1 : o }, { opacity: 0 }], { duration: 550, easing: 'ease-in', fill: 'forwards' });
  });
  const mv = il.animate(
    [{ transform: 'none' }, { transform: `translate(${dx}px,${dy}px) scale(${s})` }],
    { duration: 950, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'forwards' });
  setTimeout(() => {
    app.classList.remove('intro-pending');
    const items = [...app.querySelectorAll('.hero h1,.hero p')].concat([...app.children].filter(c => !c.classList.contains('hero')));
    items.forEach((el, i) => el.animate(
      [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],
      { duration: 550, delay: i * 90, easing: 'ease-out', fill: 'backwards' }));
  }, 620);
  mv.onfinish = () => { app.classList.remove('hide-logo'); ov.remove(); };
}

/* ============ Start ============ */
const wantIntro = !route().o && !matchMedia('(prefers-reduced-motion: reduce)').matches;
if (wantIntro) {
  $('app').classList.add('intro-pending', 'hide-logo');
  render();
  runIntro();
} else render();
</script>
</body>
</html>
